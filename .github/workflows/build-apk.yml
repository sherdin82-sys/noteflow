name: Build NoteFlow Android APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Plugins for AGP 9 and Dart Compatibility
        run: |
          python3 -c "import glob, re
          for p in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/**/android/build.gradle', recursive=True):
              try:
                  content = open(p).read()
                  content = re.sub(r'apply plugin: .kotlin-android.', '// apply plugin: kotlin-android', content)
                  content = re.sub(r'kotlinOptions\s*\{[^}]*\}', '// kotlinOptions removed for AGP 9', content)
                  if 'android {' in content and 'compileSdk' not in content:
                      content = content.replace('android {', 'android {\n    compileSdk 35')
                  open(p, 'w').write(content)
              except Exception as e:
                  print(f'Error patching {p}: {e}')

          for p in glob.glob('/home/runner/.pub-cache/hosted/pub.dev/**/record_linux/lib/record_linux.dart', recursive=True):
              try:
                  content = open(p).read()
                  if 'startStream' not in content:
                      content = content.replace(
                          'class RecordLinux extends RecordPlatform {',
                          'class RecordLinux extends RecordPlatform {\n  @override\n  Future<Stream<Uint8List>> startStream(String recorderId, RecordConfig config) async => const Stream.empty();\n'
                      )
                  if 'Future<bool> hasPermission(String recorderId) {' in content:
                      content = content.replace(
                          'Future<bool> hasPermission(String recorderId) {',
                          'Future<bool> hasPermission(String recorderId, {bool request = true}) {'
                      )
                  open(p, 'w').write(content)
                  print(f'Successfully patched record_linux at {p}')
              except Exception as e:
                  print(f'Error patching {p}: {e}')
          "


      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Core Verification Tests
        run: dart run test/unit/noteflow_core_test.dart

      - name: Configure local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Build Android Release APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
